name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional test dependencies
        run: python -m pip install ".[web,llm,test]"
      - name: Check dependencies
        run: python -m pip check
      - name: Run synthetic-data and mock-API tests
        run: python -m unittest discover -s tests -v
