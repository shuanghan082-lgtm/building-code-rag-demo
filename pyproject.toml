[project]
name = "building-code-rag-demo"
version = "0.2.0"
description = "Traceable building-standard retrieval and optional model-assisted reading demo"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.optional-dependencies]
ocr = ["rapidocr>=3.9,<4", "onnxruntime>=1.20,<2"]
llm = ["openai>=2,<3"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
building-code-search = "building_code_demo.cli:main"
building-code-demo = "building_code_demo.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["building_code_demo*"]

[tool.setuptools.package-data]
building_code_demo = ["static/*.html"]
